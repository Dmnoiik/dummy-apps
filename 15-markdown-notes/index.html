<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell Notes</title>
  <meta name="description" content="Inkwell Notes, a quiet Markdown notebook that keeps your notes in the browser." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Inkwell</h1>
      <span class="tagline">A quiet place for your notes</span>
    </div>
    <button type="button" id="btn-reset" class="btn btn-quiet">Reset demo data</button>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Notes sidebar">
      <div class="sidebar-top">
        <button type="button" id="btn-new" class="btn btn-primary">New note</button>
        <div class="view-switch" role="group" aria-label="View">
          <button type="button" id="view-notes" class="btn btn-tab is-active">Notes</button>
          <button type="button" id="view-trash" class="btn btn-tab">Trash</button>
        </div>
      </div>

      <section id="notes-panel">
        <div class="field">
          <label for="search" class="sr-only">Search notes</label>
          <input type="search" id="search" placeholder="Search notes" autocomplete="off" />
        </div>
        <div class="field field-inline">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="modified">Last modified</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>

        <h2 class="section-title">Tags</h2>
        <ul id="tag-list" class="tag-list"></ul>

        <div id="pinned-section">
          <h2 class="section-title">Pinned</h2>
          <ul id="pinned-list" class="note-list"></ul>
        </div>

        <h2 class="section-title">Notes</h2>
        <ul id="note-list" class="note-list"></ul>
        <p id="list-empty" class="muted" hidden>No notes to show.</p>
      </section>

      <section id="trash-panel" hidden>
        <div class="trash-head">
          <h2 class="section-title">Trash</h2>
          <button type="button" id="btn-empty-trash" class="btn btn-danger">Empty trash</button>
        </div>
        <ul id="trash-list" class="note-list"></ul>
        <p id="trash-empty" class="muted" hidden>The trash is empty.</p>
      </section>
    </aside>

    <main class="workspace">
      <div id="placeholder" class="placeholder">
        <p>Select a note or start a new one.</p>
      </div>

      <div id="editor" class="editor" hidden>
        <div class="editor-bar">
          <div class="field field-grow">
            <label for="note-title" class="sr-only">Title</label>
            <input type="text" id="note-title" placeholder="Title" autocomplete="off" />
          </div>
          <button type="button" id="btn-export" class="btn">Export .md</button>
          <button type="button" id="btn-trash" class="btn btn-danger">Move to trash</button>
        </div>
        <div class="editor-meta">
          <span id="note-meta"></span>
          <span id="word-count"></span>
        </div>
        <div class="panes">
          <div class="pane">
            <label for="note-body" class="pane-label">Note content</label>
            <textarea id="note-body" spellcheck="false"></textarea>
          </div>
          <div class="pane">
            <span class="pane-label" id="preview-label">Preview</span>
            <div id="preview" class="preview" aria-labelledby="preview-label"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
